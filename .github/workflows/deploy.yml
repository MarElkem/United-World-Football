# Builds the site with fresh data and publishes it to GitHub Pages.
# Runs on every push to main, every 30 minutes (to refresh scores, tables and
# headlines), and on demand from the Actions tab.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Saved copies of TheSportsDB data, so each run only refreshes a few.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-
      - name: Fetch football data
        run: npm run data
        env:
          # Optional. A free key from https://www.football-data.org/client/register
          # stored as a repository secret. Without it, openfootball is used.
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      - name: Build the site
        run: npm run build
        env:
          # Optional. The chat server's address, stored as a repository variable.
          VITE_ASK_URL: ${{ vars.ASK_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
